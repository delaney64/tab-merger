<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 200px;
        background: #1e2620;
        margin: 0;
        font-family: sans-serif;
        overflow: hidden;
      }
      .header {
        background: #2a3428;
        padding: 10px 12px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #3d4f3a;
      }
      .mono-eye-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #e05c00;
        flex-shrink: 0;
      }
      .title {
        font-size: 11px;
        font-weight: 500;
        color: #a8bca4;
        letter-spacing: 0.5px;
      }
      .helmet-wrap {
        display: flex;
        justify-content: center;
        padding: 16px 0 10px;
      }
      .merge-btn {
        margin: 4px 12px 12px;
        padding: 9px 0;
        width: calc(100% - 24px);
        background: #3d4f3a;
        color: #c8d8c4;
        border: 1px solid #5a7054;
        border-radius: 2px;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-sizing: border-box;
      }
      .merge-btn:hover { background: #4a5e46; }
      .pipe {
        height: 2px;
        background: repeating-linear-gradient(90deg, #5a7054 0px, #5a7054 8px, #2a3428 8px, #2a3428 12px);
        margin: 0 12px 10px;
        border-radius: 2px;
      }
      #status {
        font-size: 11px;
        text-align: center;
        padding: 0 12px 10px;
        color: #6a8064;
        min-height: 20px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="mono-eye-dot"></div>
      <span class="title">ZAKU-II // TAB OPS</span>
    </div>

    <div class="helmet-wrap">
      <svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <rect x="12" y="20" width="48" height="42" rx="10" fill="#4a5e46"/>
        <polygon points="36,4 28,20 44,20" fill="#3d4f3a"/>
        <rect x="33" y="4" width="6" height="10" rx="1" fill="#4a5e46"/>
        <rect x="12" y="34" width="48" height="10" rx="2" fill="#2a3428"/>
        <circle cx="36" cy="39" r="6" fill="#e05c00"/>
        <circle cx="36" cy="39" r="3" fill="#ff8c42"/>
        <rect x="10" y="28" width="4" height="12" rx="1" fill="#3d4f3a"/>
        <rect x="58" y="28" width="4" height="12" rx="1" fill="#3d4f3a"/>
        <rect x="16" y="54" width="8" height="6" rx="1" fill="#3d4f3a"/>
        <rect x="48" y="54" width="8" height="6" rx="1" fill="#3d4f3a"/>
        <rect x="18" y="60" width="36" height="8" rx="3" fill="#3d4f3a"/>
      </svg>
    </div>

    <button class="merge-btn" id="merge">&#9654; CONSOLIDATE TABS</button>
    <div class="pipe"></div>
    <p id="status">Awaiting orders</p>

    <script src="popup.js"></script>
  </body>
</html>
